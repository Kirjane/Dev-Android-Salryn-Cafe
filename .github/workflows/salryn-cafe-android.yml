name: Salryn Cafe Android Build & Boundary Gate

on:
  pull_request:
    branches:
      - main
      - 'forge/**'
  push:
    branches:
      - 'forge/**'
      - '!archive/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salryn-cafe-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-gate:
    name: Android Compile, Forbidden-Dependency & Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Verify Android boundary, compile APK & run mobile xUnit suites
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $androidProj = "src/Salryn.App.Android/Salryn.App.Android.csproj"
          if (-not (Test-Path $androidProj)) {
            Write-Host "NOT RUN: $androidProj not yet present on this branch."
            exit 0
          }

          $raw = Get-Content -Path $androidProj -Raw
          $forbidden = @("Salryn.App.WinForms", "Salryn.Desktop.WebView", "Salryn.Api.Local") | Where-Object { $raw -match [regex]::Escape($_) }
          if ($forbidden.Count -gt 0) {
            throw "Forbidden desktop/host project references in Android project: $($forbidden -join ', ')"
          }

          dotnet build $androidProj -c Release -p:AndroidPackageFormat=apk --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $mobileTests = Get-ChildItem -Path "tests" -Directory -Filter "Salryn.Cafe.*I6B*Tests" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ChildItem -Path $_.FullName -Filter "*.csproj" -File }

          foreach ($proj in $mobileTests) {
            $trxName = "$($proj.BaseName).trx"
            dotnet test $proj.FullName -c Release --nologo --logger "trx;LogFileName=$trxName" --results-directory artifacts/android-trx
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            [xml]$xml = Get-Content -Path "artifacts/android-trx/$trxName" -Raw
            $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
            $ns.AddNamespace("t", "http://microsoft.com/schemas/VisualStudio/TeamTest/2010")
            $c = $xml.SelectSingleNode("//t:ResultSummary/t:Counters", $ns)
            $executed = [int]$c.GetAttribute("executed")
            $passed = [int]$c.GetAttribute("passed")
            $failed = [int]$c.GetAttribute("failed")
            if ($executed -le 0 -or $passed -le 0 -or $failed -gt 0) {
              throw "ZERO-TEST OR FAILURE BLOCKED for $($proj.Name): executed=$executed passed=$passed failed=$failed"
            }
          }

      - name: Upload Android verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-android-${{ github.sha }}
          path: |
            artifacts/android-trx/
            src/Salryn.App.Android/bin/Release/**/*.apk
          if-no-files-found: ignore
          retention-days: 14
