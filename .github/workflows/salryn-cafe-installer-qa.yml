name: Salryn Cafe Windows Installer Acceptance

on:
  pull_request:
    branches:
      - forge/candidate-salryn-cafe
      - main
  workflow_dispatch:
    inputs:
      matched_qa:
        description: Build a matched same-SHA Windows/Android QA draft prerelease
        type: boolean
        default: false
      profile:
        type: choice
        default: ReleaseEntitled
        options: [ReleaseEntitled, DebugSynthetic]

jobs:
  matched-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.matched_qa
    permissions:
      contents: write
    uses: ./.github/workflows/salryn-cafe-qa-release.yml
    with:
      source_sha: ${{ github.sha }}
      profile: ${{ inputs.profile }}
  windows-installer-acceptance:
    if: github.event_name != 'workflow_dispatch' || !inputs.matched_qa
    name: Windows Installer Acceptance (Elevated Disposable Runner)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Salryn.App.Web production bundle
        shell: pwsh
        run: |
          Push-Location src/Salryn.App.Web
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          Pop-Location

      - name: Build live Cafe workstation bundle
        shell: pwsh
        run: |
          Push-Location apps/cafe-web
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Publish Windows Host + Desktop (Release) and stage installer assets
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $staging = Join-Path $PWD "artifacts/installer/staging/SalrynCafe"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          dotnet publish src/Salryn.Desktop.WebView/Salryn.Desktop.WebView.csproj -c Release -r win-x64 --self-contained true "-p:SourceRevisionId=$sha" -o $staging --nologo -v minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/Salryn.Api.Local/Salryn.Api.Local.csproj -c Release -r win-x64 --self-contained true "-p:SourceRevisionId=$sha" -o $staging --nologo -v minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $depsText = Get-Content -LiteralPath (Join-Path $staging 'Salryn.Api.Local.deps.json') -Raw
          if ($depsText -match '"System\.Security\.Cryptography\.Pkcs/([0-9]+\.[0-9]+\.[0-9]+)"') {
            $expectedPkcs = $Matches[1]
            $pkcsInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $staging 'System.Security.Cryptography.Pkcs.dll'))
            if (-not ($pkcsInfo.ProductVersion -and $pkcsInfo.ProductVersion.StartsWith($expectedPkcs, [StringComparison]::Ordinal))) {
              throw "Staged System.Security.Cryptography.Pkcs.dll ProductVersion '$($pkcsInfo.ProductVersion)' does not match Salryn.Api.Local.deps.json '$expectedPkcs'."
            }
            Write-Output "STAGED_PKCS_VERSION=$($pkcsInfo.ProductVersion)"
          }
          New-Item -ItemType Directory -Force -Path "$staging/assets/branding", "$staging/assets/brand" | Out-Null
          Copy-Item "assets/branding/*" "$staging/assets/branding/" -Recurse -Force
          if (Test-Path "assets/brand") { Copy-Item "assets/brand/*" "$staging/assets/brand/" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$staging/wwwroot" | Out-Null
          Copy-Item "src/Salryn.App.Web/dist/*" "$staging/wwwroot/" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$staging/cafe-dist" | Out-Null
          Copy-Item "apps/cafe-web/dist/*" "$staging/cafe-dist/" -Recurse -Force
          foreach ($requiredFile in @('Salryn.Api.Local.exe', 'Salryn.Desktop.WebView.exe', 'cafe-dist/index.html')) {
            if (-not (Test-Path (Join-Path $staging $requiredFile))) { throw "Required installed payload missing: $requiredFile" }
          }

      - name: Compile Salryn-Cafe-Setup.exe with Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $sha = git rev-parse HEAD
          & $iscc "/DMySourceRevision=$sha" "installer/SalrynCafeSetup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-Item "artifacts/installer/setup/Salryn-Cafe-Setup.exe"
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          Write-Output "SETUP_BYTES=$($setup.Length)"
          Write-Output "SETUP_SHA256=$hash"

      - name: Verify Retail Folder Protection, Fresh Install, Upgrade, and Uninstall
        shell: pwsh
        run: |
          $setup = (Resolve-Path "artifacts/installer/setup/Salryn-Cafe-Setup.exe").Path
          $logDir = Join-Path $PWD "artifacts/installer/qa-logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          # 1. Retail folder protection guard MUST fail closed even under /VERYSILENT
          $retailDir = "C:\Program Files\Kirjane Information Technology Services"
          $pRetail = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$retailDir`" /LOG=`"$logDir\retail-guard.log`"" -Wait -PassThru
          Write-Output "RETAIL_GUARD_EXIT=$($pRetail.ExitCode)"
          if ($pRetail.ExitCode -eq 0) { throw "Retail folder protection failed: installer allowed install into protected retail path!" }
          if (Test-Path "$retailDir\Salryn.Desktop.WebView.exe") { throw "Protected retail directory was modified!" }

          # 2. Fresh silent install into independent Cafe directory
          $cafeDir = "C:\Program Files\Kirjane Information Technology Services - Cafe"
          $pInstall = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$logDir\fresh-install.log`"" -Wait -PassThru
          Write-Output "FRESH_INSTALL_EXIT=$($pInstall.ExitCode)"
          if ($pInstall.ExitCode -ne 0) { throw "Fresh install failed with exit $($pInstall.ExitCode)" }
          if (-not (Test-Path "$cafeDir\Salryn.Desktop.WebView.exe")) { throw "Missing Salryn.Desktop.WebView.exe after fresh install" }
          if (-not (Test-Path "$cafeDir\Salryn.Api.Local.exe")) { throw "Missing Salryn.Api.Local.exe after fresh install" }
          if (-not (Test-Path "$cafeDir\cafe-dist\index.html")) { throw "Missing cafe-dist/index.html after fresh install" }
          if (-not (Test-Path "$cafeDir\wwwroot\index.html")) { throw "Missing wwwroot/index.html after fresh install" }
          if (-not (Test-Path "C:\ProgramData\SalrynCafe\data")) { throw "Missing C:\ProgramData\SalrynCafe\data after fresh install" }

          # 2b. Boot installed Desktop WebView2 + Local API and verify WebView2 startup, ProductId=Salryn.Cafe, /cafe/, and fail-closed first-run behavior
          $webViewDataDir = Join-Path $env:LOCALAPPDATA "SalrynCafe\WebView2"
          if (Test-Path $webViewDataDir) { Remove-Item -Recurse -Force $webViewDataDir }
          $desktopProc = Start-Process -FilePath "$cafeDir\Salryn.Desktop.WebView.exe" -WorkingDirectory $cafeDir -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:5399/health" -TimeoutSec 2
                if ($health.productId -eq "Salryn.Cafe" -and $health.status -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch { }
            }
            if (-not $healthy) { throw "Installed Salryn.Api.Local did not respond healthy as Salryn.Cafe on 127.0.0.1:5399." }
            $webViewReady = $false
            for ($wvAttempt = 0; $wvAttempt -lt 30; $wvAttempt++) {
              if ($desktopProc.HasExited) { throw "Salryn.Desktop.WebView.exe exited prematurely (code=$($desktopProc.ExitCode))." }
              if (Test-Path $webViewDataDir) { $webViewReady = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $webViewReady) { throw "Salryn.Desktop.WebView.exe did not initialize isolated WebView2 profile at $webViewDataDir." }
            if ($desktopProc.HasExited) { throw "Salryn.Desktop.WebView.exe exited unexpectedly after WebView2 initialization (code=$($desktopProc.ExitCode))." }
            if (-not (Test-Path "C:\ProgramData\SalrynCafe\data\salryn-cafe.db")) { throw "Fresh install did not create C:\ProgramData\SalrynCafe\data\salryn-cafe.db." }
            $cafeDistDiag = Invoke-RestMethod -Uri "http://127.0.0.1:5399/api/system/cafe-dist" -TimeoutSec 5
            if (-not $cafeDistDiag.resolved -or -not $cafeDistDiag.indexHtmlExists) {
              throw "Installed host did not resolve cafe-dist/index.html: $($cafeDistDiag | ConvertTo-Json -Compress)"
            }
            $cafeResp = Invoke-WebRequest -Uri "http://127.0.0.1:5399/cafe/" -UseBasicParsing -TimeoutSec 5
            if ($cafeResp.StatusCode -ne 200 -or $cafeResp.Content -notmatch "Salryn Cafe") {
              throw "Unexpected /cafe/ response from installed host (status=$($cafeResp.StatusCode))."
            }
            $bootstrap = Invoke-RestMethod -Uri "http://127.0.0.1:5399/api/bootstrap/status" -TimeoutSec 5
            if (-not $bootstrap.databaseInitialized -or -not $bootstrap.firstRunRequired -or $bootstrap.hasUsers -or $bootstrap.hasStoreSettings) {
              throw "Unexpected fresh first-run bootstrap status: $($bootstrap | ConvertTo-Json -Compress)"
            }
            $licenseStatus = Invoke-RestMethod -Uri "http://127.0.0.1:5399/api/license/status" -TimeoutSec 5
            $machineId = if ($licenseStatus.machineCode) { $licenseStatus.machineCode } else { $licenseStatus.machineFingerprint }
            if ([string]::IsNullOrWhiteSpace($machineId) -or $licenseStatus.status -eq 1 -or $licenseStatus.status -eq "Licensed" -or $licenseStatus.status -eq 5 -or $licenseStatus.status -eq "Development") {
              throw "Unexpected fresh Release license status: $($licenseStatus | ConvertTo-Json -Compress)"
            }
            $sessionResp = Invoke-RestMethod -Uri "http://127.0.0.1:5399/api/session" -TimeoutSec 5
            if ($sessionResp.isAuthenticated) { throw "Fresh install /api/session unexpectedly authenticated." }
            # Unlicensed Release first-admin creation MUST fail closed with 403 Bootstrap.HostLicenseRequired
            $firstAdminStatus = 0
            $firstAdminBody = ""
            try {
              $bodyJson = @{ storeName = "QA Cafe"; receiptWidthMm = 58; adminUsername = "admin"; adminDisplayName = "Admin"; adminPassword = "Synthetic-Unlicensed!2026" } | ConvertTo-Json
              Invoke-WebRequest -Uri "http://127.0.0.1:5399/api/bootstrap/first-admin" -Method Post -ContentType "application/json" -Body $bodyJson -UseBasicParsing -TimeoutSec 5 | Out-Null
            } catch {
              $firstAdminStatus = [int]$_.Exception.Response.StatusCode
              if ($_.ErrorDetails.Message) { $firstAdminBody = $_.ErrorDetails.Message }
            }
            if ($firstAdminStatus -ne 403 -or $firstAdminBody -notmatch "Bootstrap\.HostLicenseRequired") {
              throw "Expected 403 Bootstrap.HostLicenseRequired on unlicensed Release first-admin; got HTTP $firstAdminStatus ($firstAdminBody)"
            }
            $bootstrapAfter = Invoke-RestMethod -Uri "http://127.0.0.1:5399/api/bootstrap/status" -TimeoutSec 5
            if ($bootstrapAfter.hasUsers) { throw "Unlicensed first-admin created a user despite 403!" }
            Write-Output "INSTALLED_WEBVIEW2_PROFILE_PASS=1"
            Write-Output "INSTALLED_FIRST_RUN_FAIL_CLOSED_PASS=1"
            Write-Output "INSTALLED_STARTUP_PASS=1"
          } finally {
            Get-Process -Name "Salryn.Desktop.WebView", "Salryn.Api.Local" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
          }

          # Place synthetic marker file in C:\ProgramData\SalrynCafe\data to prove preservation across upgrade & uninstall
          Set-Content -Path "C:\ProgramData\SalrynCafe\data\preservation-marker.txt" -Value "preserve-me"

          # 3. Upgrade install over existing Cafe installation
          $pUpgrade = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$logDir\upgrade-install.log`"" -Wait -PassThru
          Write-Output "UPGRADE_INSTALL_EXIT=$($pUpgrade.ExitCode)"
          if ($pUpgrade.ExitCode -ne 0) { throw "Upgrade install failed with exit $($pUpgrade.ExitCode)" }
          if ((Get-Content "C:\ProgramData\SalrynCafe\data\preservation-marker.txt" -Raw).Trim() -ne "preserve-me") {
            throw "Cafe data was not preserved across upgrade!"
          }

          # 4. Silent uninstall removes app binaries while preserving C:\ProgramData\SalrynCafe
          $unins = "$cafeDir\unins000.exe"
          if (-not (Test-Path $unins)) { throw "Missing unins000.exe" }
          $pUnins = Start-Process -FilePath $unins -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$logDir\uninstall.log`"" -Wait -PassThru
          Write-Output "UNINSTALL_EXIT=$($pUnins.ExitCode)"
          if ($pUnins.ExitCode -ne 0) { throw "Uninstall failed with exit $($pUnins.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path "$cafeDir\Salryn.Desktop.WebView.exe") { throw "App binary survived uninstall!" }
          if ((Get-Content "C:\ProgramData\SalrynCafe\data\preservation-marker.txt" -Raw).Trim() -ne "preserve-me") {
            throw "C:\ProgramData\SalrynCafe data was not preserved across uninstall!"
          }
          Write-Output "PASS: Windows Installer Acceptance (Retail Guard + Fresh Install + Upgrade + Uninstall + Data Preservation)"

      - name: Upload installer and QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-acceptance-${{ github.sha }}
          path: |
            artifacts/installer/setup/Salryn-Cafe-Setup.exe
            artifacts/installer/qa-logs/
