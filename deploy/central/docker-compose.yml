# Salryn Cafe Central Sync — Docker Compose Template (NO LIVE CREDENTIALS)
services:
  central-sync:
    build:
      context: ../..
      dockerfile: deploy/central/Dockerfile
    container_name: salryn-cafe-central-sync
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://0.0.0.0:8443"
      SALRYN_CAFE_CENTRAL_DB_PATH: "/var/lib/salryn-cafe-central/data/salryn-cafe-central.db"
      SALRYN_CAFE_CENTRAL_REQUIRE_HTTPS: "true"
      CentralSync__TrustForwardedProto: "true"
      CentralSync__OfflineLeaseHours: "${SALRYN_OFFLINE_LEASE_HOURS:-24}"
    volumes:
      - salryn_cafe_central_data:/var/lib/salryn-cafe-central/data
      - salryn_cafe_central_backups:/var/lib/salryn-cafe-central/backups
    ports:
      # Bind loopback only on host; terminate TLS via Cloudflare Tunnel or Nginx/Caddy
      - "127.0.0.1:8443:8443"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: salryn-cafe-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS_FILE:-./tunnel-credentials.json}:/etc/cloudflared/credentials.json:ro
    depends_on:
      - central-sync

volumes:
  salryn_cafe_central_data:
  salryn_cafe_central_backups:
